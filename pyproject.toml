[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mesh-archivist-engine"
version = "1.0.1"
description = "Standard-library-first repository mesh archival and verification tooling"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "HuffmanMainNode" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.scripts]
meshctl = "meshctl:main"
mesh-crawl-namespaces = "crawl_namespaces:main"
mesh-gap-plan = "gap_planner:main"
mesh-diode-promote = "diode_promote:main"

[tool.setuptools]
packages = ["mesh_agent"]
py-modules = ["mesh_runtime", "meshctl", "crawl_namespaces", "diode_promote", "gap_planner"]
